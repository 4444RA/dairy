<!DOCTYPE html>
<html lang="en">
<head>
        <link rel="apple-touch-icon" href="wonder.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f4ef">
    <title>Daily Food Tracker</title>
    <style>
        :root {
            --bg-color: #f5f4ef;
            --card-bg: #ffffff;
            --card-border: #dcd9d0;
            --soft-bg: #f0eee7;
            --text-main: #1a1a1a;
            --text-muted: #52524e;
            --accent: #1b6b46;
            --accent-hover: #145336;
            --accent-light: #e7f4ed;
            --danger: #b42318;
            --danger-bg: #fef3f2;
            --danger-border: #fecdca;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 18px;
            line-height: 1.45;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 580px;
            padding: 18px 16px 60px 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .app-title {
            font-size: 1.55rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.02em;
        }
        .sync-pill {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-light);
            padding: 6px 12px;
            border-radius: 999px;
        }

        /* Date Bar */
        .date-bar {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .date-controls {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 8px;
            align-items: center;
        }
        .date-display {
            text-align: center;
            font-size: 1.15rem;
            font-weight: 700;
        }
        .date-picker-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .date-input {
            flex: 1;
            font-size: 1rem;
            font-family: inherit;
            padding: 10px 12px;
            border: 2px solid var(--card-border);
            border-radius: 10px;
            background: var(--soft-bg);
            color: var(--text-main);
            min-height: 46px;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0;
        }

        /* Buttons */
        .btn {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 16px;
            min-height: 48px;
            border-radius: 10px;
            border: 2px solid var(--card-border);
            background: var(--soft-bg);
            color: var(--text-main);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background-color 0.15s, transform 0.05s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        .btn-primary.added {
            background: #0f4c81;
            border-color: #0f4c81;
        }
        .btn-danger {
            background: var(--danger-bg);
            border-color: var(--danger-border);
            color: var(--danger);
            padding: 10px 14px;
        }
        .btn-small {
            min-height: 44px;
            padding: 8px 14px;
            font-size: 0.95rem;
        }

        /* Calorie Summary */
        .calorie-hero {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }
        .calorie-big {
            font-size: 2.75rem;
            font-weight: 800;
            line-height: 1;
            color: var(--text-main);
        }
        .calorie-goal-text {
            font-size: 1.15rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .status-banner {
            font-size: 1.05rem;
            font-weight: 700;
            padding: 10px 14px;
            border-radius: 10px;
            background: var(--soft-bg);
            color: var(--text-main);
        }
        .status-banner.goal-met {
            background: var(--accent-light);
            color: var(--accent);
        }
        .progress-track {
            width: 100%;
            height: 16px;
            background: #e4e1d8;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            border-radius: 999px;
            transition: width 0.25s ease;
        }

        /* Macros Grid */
        .macro-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .macro-box {
            background: var(--soft-bg);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .macro-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
        }
        .macro-value {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-main);
        }
        .macro-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Inputs & Forms */
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field-label {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .text-input {
            width: 100%;
            font-family: inherit;
            font-size: 1.05rem;
            padding: 12px 14px;
            min-height: 48px;
            border: 2px solid var(--card-border);
            border-radius: 10px;
            background: #ffffff;
            color: var(--text-main);
        }
        .text-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .form-panel {
            background: var(--soft-bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Food Rows */
        .food-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .food-row {
            background: var(--soft-bg);
            border: 2px solid #e4e1d8;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .food-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }
        .food-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .food-details {
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .empty-note {
            font-size: 1rem;
            color: var(--text-muted);
            padding: 8px 0;
        }

        /* Past Days */
        .history-row {
            background: var(--soft-bg);
            border: 2px solid #e4e1d8;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-align: left;
            width: 100%;
            font-family: inherit;
        }
        .history-row:hover {
            border-color: var(--accent);
        }

        /* Toast Confirmation */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 22px;
            border-radius: 999px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            z-index: 200;
            display: none;
        }

        @media (max-width: 420px) {
            .macro-grid {
                grid-template-columns: 1fr;
            }
            .food-row {
                flex-direction: column;
                align-items: stretch;
            }
            .food-row .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <h1 class="app-title">Daily Food Tracker</h1>
        <span id="sync-status" class="sync-pill">Saved ✓</span>
    </header>

    <!-- Date Selector -->
    <div class="date-bar">
        <div class="date-controls">
            <button class="btn btn-small" onclick="shiftDate(-1)">◀ Prev</button>
            <div id="friendly-date" class="date-display">Today</div>
            <button class="btn btn-small" onclick="shiftDate(1)">Next ▶</button>
        </div>
        <div class="date-picker-row">
            <input type="date" id="diet-date-input" class="date-input" onchange="changeDietDate(this.value)">
            <button id="today-btn" class="btn btn-small" onclick="goToToday()">Today</button>
        </div>
    </div>

    <!-- Daily Summary Card -->
    <section class="card" id="summary-section"></section>

    <!-- What I Ate Today Card -->
    <section class="card" id="logged-section"></section>

    <!-- Quick Add Foods Card -->
    <section class="card">
        <div class="card-header">
            <h2 class="card-title">Add Food</h2>
            <button id="toggle-custom-btn" class="btn btn-small" onclick="toggleCustomFoodForm()">+ My Own Food</button>
        </div>

        <div id="custom-food-container"></div>
        <div id="quick-food-list" class="food-list"></div>
    </section>

    <!-- Recent Days Card -->
    <section class="card" id="recent-days-section"></section>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCQ4vHqGiv_yRkA0zZaaOU24gxhqBkxnv4",
        authDomain: "journal-a003f.firebaseapp.com",
        databaseURL: "https://journal-a003f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "journal-a003f",
        storageBucket: "journal-a003f.firebasestorage.app",
        messagingSenderId: "1038636626553",
        appId: "1:1038636626553:web:7a91c321e39c146bdc9aa8"
    };

    // Separate Firebase path so these logs don't mix with your workout tracker
    let dietDbRef = null;
    let dietTargetDbRef = null;
    try {
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        dietDbRef = database.ref('simple_diet_tracker/diet_logs');
        dietTargetDbRef = database.ref('simple_diet_tracker/diet_target');
    } catch (e) {
        console.warn("Running in local-only mode:", e);
    }

    const DIET_FOODS = [
        { id: "coke_365", name: "Coke can (365ml)", calories: 157, protein: 0, carbs: 38.7, fat: 0 },
        { id: "smiths_original_45", name: "Smith's Chips Original (45g)", calories: 246, protein: 3, carbs: 22.8, fat: 15.7 },
        { id: "lasagne_small", name: "Lasagne (small portion)", calories: 500, protein: 30, carbs: 33, fat: 23 },
        { id: "cheese_crackers_38", name: "Cheese & Crackers (38g pack)", calories: 155, protein: 7.4, carbs: 9.3, fat: 9.8 }
    ];

    function getLocalDateStr(offsetDays = 0) {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];
    }

    function formatFriendlyDate(dateStr) {
        const today = getLocalDateStr(0);
        const yesterday = getLocalDateStr(-1);
        const tomorrow = getLocalDateStr(1);

        const d = new Date(dateStr + "T12:00:00");
        const formatted = d.toLocaleDateString(undefined, {
            weekday: 'short',
            day: 'numeric',
            month: 'short'
        });

        if (dateStr === today) return `Today (${formatted})`;
        if (dateStr === yesterday) return `Yesterday (${formatted})`;
        if (dateStr === tomorrow) return `Tomorrow (${formatted})`;
        return formatted;
    }

    function formatNum(n) {
        return Number((parseFloat(n) || 0).toFixed(1));
    }

    function escapeHtml(str) {
        return String(str || '')
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    let dietLogs = JSON.parse(localStorage.getItem('simple_diet_log_cache')) || {};
    let dietTarget = JSON.parse(localStorage.getItem('simple_diet_target_cache')) || { calories: 2000, protein: 100 };
    let selectedDate = getLocalDateStr(0);
    let showGoalEditor = false;
    let showCustomForm = false;
    let toastTimer = null;

    if (dietDbRef) {
        dietDbRef.on('value', snapshot => {
            dietLogs = snapshot.val() || {};
            localStorage.setItem('simple_diet_log_cache', JSON.stringify(dietLogs));
            renderAll();
            setSyncText("Saved ✓");
        });
    }

    if (dietTargetDbRef) {
        dietTargetDbRef.on('value', snapshot => {
            const val = snapshot.val();
            if (val && val.calories) {
                dietTarget = val;
                localStorage.setItem('simple_diet_target_cache', JSON.stringify(dietTarget));
                renderSummary();
                renderRecentDays();
            }
        });
    }

    function setSyncText(text) {
        const el = document.getElementById('sync-status');
        if (el) el.textContent = text;
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.display = 'block';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.style.display = 'none';
        }, 2200);
    }

    function getEntriesForDate(dateStr) {
        const dayObj = dietLogs[dateStr];
        if (!dayObj || !dayObj.entries) return [];
        return Object.values(dayObj.entries).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
    }

    function calculateTotals(entries) {
        return entries.reduce((acc, item) => {
            acc.calories += parseFloat(item.calories) || 0;
            acc.protein += parseFloat(item.protein) || 0;
            acc.carbs += parseFloat(item.carbs) || 0;
            acc.fat += parseFloat(item.fat) || 0;
            return acc;
        }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
    }

    function renderDateBar() {
        document.getElementById('friendly-date').textContent = formatFriendlyDate(selectedDate);
        document.getElementById('diet-date-input').value = selectedDate;
        const todayBtn = document.getElementById('today-btn');
        const isToday = selectedDate === getLocalDateStr(0);
        todayBtn.style.opacity = isToday ? "0.5" : "1";
    }

    function renderSummary() {
        const entries = getEntriesForDate(selectedDate);
        const totals = calculateTotals(entries);
        const cal = Math.round(totals.calories);
        const pro = formatNum(totals.protein);
        const carb = formatNum(totals.carbs);
        const fat = formatNum(totals.fat);

        const targetCal = parseInt(dietTarget.calories) || 2000;
        const targetPro = parseInt(dietTarget.protein) || 0;
        const pct = Math.min(100, Math.round((cal / targetCal) * 100));
        const diff = targetCal - cal;

        const isGoalMet = cal >= targetCal;
        const statusMsg = diff > 0
            ? `${diff} calories remaining for today`
            : diff === 0
                ? "Daily calorie goal reached!"
                : `Daily goal reached (+${Math.abs(diff)} calories over)`;

        document.getElementById('summary-section').innerHTML = `
            <div class="card-header">
                <h2 class="card-title">Daily Calories</h2>
                <button class="btn btn-small" onclick="toggleGoalEditor()">
                    ${showGoalEditor ? 'Close' : 'Change Goal'}
                </button>
            </div>

            <div class="calorie-hero">
                <span class="calorie-big">${cal}</span>
                <span class="calorie-goal-text">of ${targetCal} calories</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill" style="width: ${pct}%;"></div>
            </div>

            <div class="status-banner ${isGoalMet ? 'goal-met' : ''}">
                ${statusMsg}
            </div>

            ${showGoalEditor ? `
                <div class="form-panel">
                    <div class="two-col">
                        <div class="field-group">
                            <label class="field-label" for="goal-cal-input">Daily Calorie Goal</label>
                            <input type="number" id="goal-cal-input" class="text-input" value="${targetCal}">
                        </div>
                        <div class="field-group">
                            <label class="field-label" for="goal-pro-input">Protein Goal (g)</label>
                            <input type="number" id="goal-pro-input" class="text-input" value="${targetPro}">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="saveGoals()">Save Goal</button>
                </div>
            ` : ''}

            <div class="macro-grid">
                <div class="macro-box">
                    <span class="macro-label">Protein</span>
                    <span class="macro-value">${pro}g</span>
                    <span class="macro-sub">${targetPro > 0 ? `Goal: ${targetPro}g` : 'eaten'}</span>
                </div>
                <div class="macro-box">
                    <span class="macro-label">Carbs</span>
                    <span class="macro-value">${carb}g</span>
                    <span class="macro-sub">eaten</span>
                </div>
                <div class="macro-box">
                    <span class="macro-label">Fat</span>
                    <span class="macro-value">${fat}g</span>
                    <span class="macro-sub">eaten</span>
                </div>
            </div>
        `;
    }

    function renderLoggedFoods() {
        const entries = getEntriesForDate(selectedDate);
        let listHtml = "";

        if (entries.length === 0) {
            listHtml = `<div class="empty-note">Nothing logged yet for this day. Tap "+ Add" on a food below.</div>`;
        } else {
            listHtml = entries.map(item => `
                <div class="food-row">
                    <div class="food-info">
                        <span class="food-name">${escapeHtml(item.name)}</span>
                        <span class="food-details">
                            ${Math.round(item.calories)} calories · ${formatNum(item.protein)}g protein
                        </span>
                    </div>
                    <button class="btn btn-danger" onclick="removeEntry('${selectedDate}', '${item.id}')">Remove</button>
                </div>
            `).join('');
        }

        document.getElementById('logged-section').innerHTML = `
            <div class="card-header">
                <h2 class="card-title">What I Ate</h2>
                <span style="font-size: 0.95rem; font-weight: 700; color: var(--text-muted);">
                    ${entries.length} ${entries.length === 1 ? 'item' : 'items'}
                </span>
            </div>
            <div class="food-list">${listHtml}</div>
        `;
    }

    function renderCustomForm() {
        const btn = document.getElementById('toggle-custom-btn');
        btn.textContent = showCustomForm ? 'Close' : '+ My Own Food';

        const container = document.getElementById('custom-food-container');
        if (!showCustomForm) {
            container.innerHTML = "";
            return;
        }

        container.innerHTML = `
            <div class="form-panel">
                <div class="field-group">
                    <label class="field-label" for="custom-name">Food Name</label>
                    <input type="text" id="custom-name" class="text-input" placeholder="e.g. Cup of tea with milk">
                </div>
                <div class="two-col">
                    <div class="field-group">
                        <label class="field-label" for="custom-cal">Calories</label>
                        <input type="number" id="custom-cal" class="text-input" placeholder="e.g. 150">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="custom-pro">Protein (g)</label>
                        <input type="number" step="0.1" id="custom-pro" class="text-input" placeholder="Optional">
                    </div>
                </div>
                <div class="two-col">
                    <div class="field-group">
                        <label class="field-label" for="custom-carb">Carbs (g)</label>
                        <input type="number" step="0.1" id="custom-carb" class="text-input" placeholder="Optional">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="custom-fat">Fat (g)</label>
                        <input type="number" step="0.1" id="custom-fat" class="text-input" placeholder="Optional">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addCustomFood()">Add This Food to Today</button>
            </div>
        `;
    }

    function renderQuickFoodList() {
        const listEl = document.getElementById('quick-food-list');

        listEl.innerHTML = DIET_FOODS.map(food => `
            <div class="food-row">
                <div class="food-info">
                    <span class="food-name">${food.name}</span>
                    <span class="food-details">${food.calories} calories · ${formatNum(food.protein)}g protein</span>
                </div>
                <button class="btn btn-primary" id="add-btn-${food.id}" onclick="addPresetFood('${food.id}', this)">+ Add</button>
            </div>
        `).join('');
    }

    function renderRecentDays() {
        const targetCal = parseInt(dietTarget.calories) || 2000;
        const dates = Object.keys(dietLogs)
            .filter(d => getEntriesForDate(d).length > 0)
            .sort((a, b) => new Date(b) - new Date(a))
            .slice(0, 7);

        let html = "";
        if (dates.length === 0) {
            html = `<div class="empty-note">No past days recorded yet.</div>`;
        } else {
            html = dates.map(d => {
                const entries = getEntriesForDate(d);
                const tot = calculateTotals(entries);
                const cal = Math.round(tot.calories);
                const pro = formatNum(tot.protein);
                const hit = cal >= targetCal;

                return `
                    <button class="history-row" onclick="changeDietDate('${d}')">
                        <div class="food-info">
                            <span class="food-name">${formatFriendlyDate(d)}</span>
                            <span class="food-details">${entries.length} ${entries.length === 1 ? 'item' : 'items'}</span>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-weight:800; font-size:1.05rem;">${cal} cal</div>
                            <div style="font-size:0.9rem; color:${hit ? 'var(--accent)' : 'var(--text-muted)'}; font-weight:700;">
                                ${pro}g protein ${hit ? '· Goal ✓' : ''}
                            </div>
                        </div>
                    </button>
                `;
            }).join('');
        }

        document.getElementById('recent-days-section').innerHTML = `
            <div class="card-header">
                <h2 class="card-title">Recent Days</h2>
                <span style="font-size:0.9rem; color:var(--text-muted);">Tap a day to view</span>
            </div>
            <div class="food-list">${html}</div>
        `;
    }

    function renderAll() {
        renderDateBar();
        renderSummary();
        renderLoggedFoods();
        renderCustomForm();
        renderQuickFoodList();
        renderRecentDays();
    }

    // Actions
    function changeDietDate(dateStr) {
        if (!dateStr) return;
        selectedDate = dateStr;
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function shiftDate(days) {
        const d = new Date(selectedDate + "T12:00:00");
        d.setDate(d.getDate() + days);
        const nextStr = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];
        changeDietDate(nextStr);
    }

    function goToToday() {
        changeDietDate(getLocalDateStr(0));
    }

    function toggleGoalEditor() {
        showGoalEditor = !showGoalEditor;
        renderSummary();
    }

    function saveGoals() {
        const cal = parseInt(document.getElementById('goal-cal-input').value);
        const pro = parseInt(document.getElementById('goal-pro-input').value) || 0;
        if (!cal || cal <= 0) {
            alert("Please enter a daily calorie goal.");
            return;
        }
        dietTarget = { calories: cal, protein: pro };
        localStorage.setItem('simple_diet_target_cache', JSON.stringify(dietTarget));
        if (dietTargetDbRef) dietTargetDbRef.set(dietTarget);
        showGoalEditor = false;
        renderSummary();
        renderRecentDays();
        showToast("Goal updated");
    }

    function toggleCustomFoodForm() {
        showCustomForm = !showCustomForm;
        renderCustomForm();
    }

    function saveEntry(entry) {
        if (!dietLogs[selectedDate]) dietLogs[selectedDate] = { entries: {} };
        if (!dietLogs[selectedDate].entries) dietLogs[selectedDate].entries = {};
        dietLogs[selectedDate].entries[entry.id] = entry;

        localStorage.setItem('simple_diet_log_cache', JSON.stringify(dietLogs));
        if (dietDbRef) {
            setSyncText("Saving...");
            dietDbRef.child(selectedDate).child('entries').child(entry.id).set(entry)
                .then(() => setSyncText("Saved ✓"))
                .catch(() => setSyncText("Saved locally"));
        }

        renderSummary();
        renderLoggedFoods();
        renderRecentDays();
    }

    function addPresetFood(foodId, btnEl) {
        const food = DIET_FOODS.find(f => f.id === foodId);
        if (!food) return;

        const entry = {
            id: `food_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
            name: food.name,
            calories: food.calories,
            protein: food.protein,
            carbs: food.carbs,
            fat: food.fat,
            timestamp: Date.now()
        };

        saveEntry(entry);
        showToast(`Added ${food.name}`);

        if (btnEl) {
            btnEl.textContent = "Added ✓";
            btnEl.classList.add('added');
            setTimeout(() => {
                btnEl.textContent = "+ Add";
                btnEl.classList.remove('added');
            }, 900);
        }
    }

    function addCustomFood() {
        const name = (document.getElementById('custom-name').value || '').trim();
        const cal = parseFloat(document.getElementById('custom-cal').value) || 0;
        const pro = parseFloat(document.getElementById('custom-pro').value) || 0;
        const carb = parseFloat(document.getElementById('custom-carb').value) || 0;
        const fat = parseFloat(document.getElementById('custom-fat').value) || 0;

        if (!name || cal <= 0) {
            alert("Please enter both a food name and calories.");
            return;
        }

        const entry = {
            id: `food_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
            name: name,
            calories: cal,
            protein: pro,
            carbs: carb,
            fat: fat,
            timestamp: Date.now()
        };

        saveEntry(entry);
        showCustomForm = false;
        renderCustomForm();
        showToast(`Added ${name}`);
    }

    function removeEntry(dateStr, entryId) {
        if (dietLogs[dateStr] && dietLogs[dateStr].entries) {
            delete dietLogs[dateStr].entries[entryId];
        }
        localStorage.setItem('simple_diet_log_cache', JSON.stringify(dietLogs));
        if (dietDbRef) {
            dietDbRef.child(dateStr).child('entries').child(entryId).remove();
        }
        renderSummary();
        renderLoggedFoods();
        renderRecentDays();
        showToast("Food removed");
    }

    window.onload = renderAll;
</script>
</body>
</html>
